[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aibuildai-mcp"
version = "0.1.0"
description = "A knowledge base of curated skills for building AI models, served as one MCP retrieval service over Streamable HTTP, plus the offline sourcing pipelines that build its corpus."
requires-python = ">=3.11,<3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "txtai>=9.11,<10",
    "sentence-transformers>=5,<6",
    "semchunk>=3,<5",
    "pydantic>=2,<3",
    "torch>=2.6,<3",
]

[project.optional-dependencies]
dev = [
    "pyright>=1.1,<2",
    "ruff>=0.15,<0.16",
]
server = [
    "mcp==2.0.0b2",
    "mcp-types==2.0.0b2",
    "opentelemetry-instrumentation-asgi>=0.60b0,<1",
    "opentelemetry-sdk>=1.39,<2",
    "uvicorn>=0.31.1,<1",
    "starlette>=0.37,<2",
]
# Producer-layer (offline sourcing pipelines) deps. Kept OUT of the core
# dependencies so the server-layer Docker image never pulls them in.
producers = [
    "claude-agent-sdk>=0.2.152,<0.3",
    "pandas>=2,<3",
    "pyyaml>=6,<7",
    "requests>=2.28,<3",
]

[tool.setuptools.packages.find]
include = ["aibuildai_mcp*", "sourcing*"]

[tool.pyright]
include = ["aibuildai_mcp", "sourcing"]
exclude = ["**/__pycache__", "**/.*"]
typeCheckingMode = "basic"
useLibraryCodeForTypes = false
reportMissingImports = false
reportPrivateImportUsage = false
